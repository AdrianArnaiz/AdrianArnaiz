{{/* Based on the pinned citation partial; native copy button and explicit feedback. */}}
<!-- Citation modal -->
<div id="modal" class="modal fade" role="dialog">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">{{ i18n "btn_cite" }}</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <pre><code class="tex hljs" tabindex="0" aria-label="BibTeX citation"></code></pre>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-primary my-1 js-copy-cite">
          <span class="citation-copy-icon" aria-hidden="true">
            <i class="fas fa-copy"></i><i class="fas fa-check"></i>
          </span>
          <span data-copy-label>{{ i18n "btn_copy" }}</span>
        </button>
        <a class="btn btn-outline-primary my-1 js-download-cite" href="#" target="_blank">
          <i class="fas fa-download" aria-hidden="true"></i> {{ i18n "btn_download" }}
        </a>
        <div id="modal-error"></div>
        <span class="sr-only" data-copy-status role="status" aria-live="polite" aria-atomic="true"></span>
      </div>
    </div>
  </div>
</div>
